apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-trading-dev

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - DATA_PROVIDER=mock
      - WORKER_INTERVAL_SECONDS=15
      - METRICS_ENABLED=true
      - LOG_LEVEL=DEBUG

# Local cluster: smaller footprint
patches:
  - path: replica-patch.yaml
