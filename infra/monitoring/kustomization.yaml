apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 7 monitoring stack: Prometheus (pod-SD scrape + alert rules) and
# Grafana (provisioned datasource + trading dashboard). Deploy on top of an
# existing app overlay:  kubectl apply -k infra/monitoring
# (the target namespace must exist — the dev overlay creates ai-trading-dev).
# For prod: change namespace here to ai-trading-prod.

namespace: ai-trading-dev

resources:
  - prometheus.yaml
  - grafana.yaml
  - monitoring-ingress.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus-config.yaml
      - alerts.yml=alerts.yaml

# NOTE: app pods opt into scraping via prometheus.io/* annotations that live
# on the base deployments (infra/k8s/base) — a patch here cannot match, these
# Deployments belong to the app overlays, not this stack.
