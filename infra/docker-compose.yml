name: ai-trading-signals

services:
  backend:
    build: ../backend
    image: ai-trading/backend:latest
    environment:
      DATA_PROVIDER: ${DATA_PROVIDER:-binance}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      WORKER_ENABLED: "false" # dedicated worker container generates signals
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ../backend
    image: ai-trading/backend:latest
    command: ["python", "-m", "app.worker_main"]
    environment:
      DATA_PROVIDER: ${DATA_PROVIDER:-binance}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true # worker serves no HTTP; image default check does not apply
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ../frontend
    image: ai-trading/frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
