# Images are patched at CD time from workflow env (owner + SHA tag).
# These placeholders keep `kubectl kustomize` valid for local/CI validation.
# CD step "Pin images" rewrites only the __CD_*__ tokens.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/__CD_OWNER__/ai-trading-backend:__CD_TAG__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/__CD_OWNER__/ai-trading-frontend:__CD_TAG__
---
# Worker reuses the backend image (its own entrypoint via command:) —
# without this patch it keeps pulling ai-trading/backend:latest from
# Docker Hub, which does not exist (ImagePullBackOff → rollout timeout).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ghcr.io/__CD_OWNER__/ai-trading-backend:__CD_TAG__
