# Ingress for the monitoring UIs, merged into the same nginx (hostPort 8090).
# Path-prefix routing: each app must be configured to run under its prefix
# (GF_SERVER_ROOT_URL for Grafana; Prometheus v3.13+ serves /prometheus when
# started with --web.route-prefix=/prometheus, added via kustomize patch).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: ai-trading-signals
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: trading.local
      http:
        paths:
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
