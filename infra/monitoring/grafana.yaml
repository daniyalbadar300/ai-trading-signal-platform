apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090/prometheus
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  labels:
    app: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-trading
  labels:
    app: grafana
data:
  trading-signals.json: |-
    {
      "title": "AI Trading Signals",
      "uid": "trading-signals",
      "tags": ["ai-trading"],
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(worker_running, namespace)",
            "includeAll": true,
            "multi": false,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Worker Running",
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "max(worker_running{namespace=~\"$namespace\"})",
              "legendFormat": "worker"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "UP", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Signals Generated (1h)",
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(increase(signals_generated_total{namespace=~\"$namespace\"}[1h]))",
              "legendFormat": "signals"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Worker Cycle Errors (1h)",
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(increase(worker_cycle_errors_total{namespace=~\"$namespace\"}[1h]))",
              "legendFormat": "errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "API 5xx Rate (5m)",
          "gridPos": { "h": 6, "w": 4, "x": 12, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{namespace=~\"$namespace\", status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\"}[5m])), 0.001)",
              "legendFormat": "5xx %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 5 } ] }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Signals by Action (rate/10m)",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (action) (rate(signals_generated_total{namespace=~\"$namespace\"}[10m]))",
              "legendFormat": "{{action}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Commentary Source (rate/10m)",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (source) (rate(commentary_source_total{namespace=~\"$namespace\"}[10m]))",
              "legendFormat": "{{source}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "API Requests by Status (rate/5m)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "API Latency p95 (5m)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" },
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_USERS_DEFAULT_THEME
              value: dark
            # Served under /grafana behind the shared trading.local ingress
            - name: GF_SERVER_ROOT_URL
              value: http://trading.local:8090/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-trading
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
